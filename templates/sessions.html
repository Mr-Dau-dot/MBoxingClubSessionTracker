{% extends "base.html" %}

{% block title %} Sessions {% endblock %}

{% block content %}
<body>
    {% for session in sessions %}
        <p> {{session.date}} | {{ session.start_time}} - {{ session.end_time}} | Coach {{session.coach.name}} | Member: {{ session.member.name }}</p>
        <a href="{{ url_for('delete_session', session_id=session.id) }}"> Delete </a>
    {% endfor %}
</body>
{% endblock %}
