{% extends "base.html" %}

{% block title %} Creating Package {% endblock %}

{% block content %}
<body>
    <form method="POST">
      {{ form.hidden_tag() }}
      {% for field in form %}
        {% if field.name == "coach_id" and current_user.role != "admin" %}
        {% else %}
            <br>
            {{ field.label }}
            {{ field }}
        {% endif %}
      {% endfor %}
    </form>
</body>
{% endblock %}
